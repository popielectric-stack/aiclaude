[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-devops-coding-agent"
version = "0.1.0"
description = "AI DevOps & Coding Agent controlled exclusively through Telegram."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
asyncio_mode = "auto"
